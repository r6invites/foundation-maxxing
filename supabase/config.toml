# Local Supabase stack settings. Hosted projects take their settings from the dashboard;
# the values that matter there are listed in README.md ("Supabase project settings").
project_id = "foundation-maxxing"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Visitors cannot create accounts on their own. Students register through an Edge Function
# (Stage 2a) and staff are invited through the invite-user function.
enable_signup = false
minimum_password_length = 10

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.rate_limit]
sign_in_sign_ups = 30
token_refresh = 150

[storage]
enabled = true
file_size_limit = "2MiB"

[functions.invite-user]
verify_jwt = true

# Called while signed out; it answers the same way for every address.
[functions.request-password-reset]
verify_jwt = false
